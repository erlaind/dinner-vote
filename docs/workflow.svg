<svg width="560" viewBox="0 0 680 726" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="From installing Claude Code to a deployed live app">
  <title>From installing Claude Code to a deployed live app</title>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#7d8590" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- legend -->
  <rect x="205" y="24" width="13" height="13" rx="3" fill="#4a90d9"/>
  <text x="224" y="34" font-size="12" fill="#5a6270">Set up</text>
  <rect x="300" y="24" width="13" height="13" rx="3" fill="#2bb3a3"/>
  <text x="319" y="34" font-size="12" fill="#5a6270">Build</text>
  <rect x="390" y="24" width="13" height="13" rx="3" fill="#e0a33a"/>
  <text x="409" y="34" font-size="12" fill="#5a6270">Ship</text>

  <!-- step 1 -->
  <rect x="195" y="64" width="320" height="48" rx="8" fill="#e6f1fb" stroke="#4a90d9" stroke-width="1"/>
  <circle cx="170" cy="88" r="15" fill="#4a90d9"/>
  <text x="170" y="93" font-size="14" font-weight="500" fill="#ffffff" text-anchor="middle">1</text>
  <text x="215" y="85" font-size="14" font-weight="500" fill="#0c447c">Install Claude Code</text>
  <text x="215" y="101" font-size="12" fill="#2d6ca8">one-time install</text>
  <line x1="355" y1="112" x2="355" y2="128" stroke="#7d8590" stroke-width="0.8" marker-end="url(#arrow)"/>

  <!-- step 2 -->
  <rect x="195" y="130" width="320" height="48" rx="8" fill="#e6f1fb" stroke="#4a90d9" stroke-width="1"/>
  <circle cx="170" cy="154" r="15" fill="#4a90d9"/>
  <text x="170" y="159" font-size="14" font-weight="500" fill="#ffffff" text-anchor="middle">2</text>
  <text x="215" y="151" font-size="14" font-weight="500" fill="#0c447c">Create a folder on Desktop</text>
  <text x="215" y="167" font-size="12" fill="#2d6ca8">your project home</text>
  <line x1="355" y1="178" x2="355" y2="194" stroke="#7d8590" stroke-width="0.8" marker-end="url(#arrow)"/>

  <!-- step 3 -->
  <rect x="195" y="196" width="320" height="48" rx="8" fill="#e6f1fb" stroke="#4a90d9" stroke-width="1"/>
  <circle cx="170" cy="220" r="15" fill="#4a90d9"/>
  <text x="170" y="225" font-size="14" font-weight="500" fill="#ffffff" text-anchor="middle">3</text>
  <text x="215" y="217" font-size="14" font-weight="500" fill="#0c447c">Open Claude Code in it</text>
  <text x="215" y="233" font-size="12" fill="#2d6ca8">start a chat session</text>
  <line x1="355" y1="244" x2="355" y2="260" stroke="#7d8590" stroke-width="0.8" marker-end="url(#arrow)"/>

  <!-- step 4 -->
  <rect x="195" y="262" width="320" height="48" rx="8" fill="#def5f1" stroke="#2bb3a3" stroke-width="1"/>
  <circle cx="170" cy="286" r="15" fill="#2bb3a3"/>
  <text x="170" y="291" font-size="14" font-weight="500" fill="#ffffff" text-anchor="middle">4</text>
  <text x="215" y="283" font-size="14" font-weight="500" fill="#0b5c54">Describe the app in a prompt</text>
  <text x="215" y="299" font-size="12" fill="#1a8278">plain english, no coding</text>
  <line x1="355" y1="310" x2="355" y2="326" stroke="#7d8590" stroke-width="0.8" marker-end="url(#arrow)"/>

  <!-- step 5 -->
  <rect x="195" y="328" width="320" height="48" rx="8" fill="#def5f1" stroke="#2bb3a3" stroke-width="1"/>
  <circle cx="170" cy="352" r="15" fill="#2bb3a3"/>
  <text x="170" y="357" font-size="14" font-weight="500" fill="#ffffff" text-anchor="middle">5</text>
  <text x="215" y="349" font-size="14" font-weight="500" fill="#0b5c54">Build, preview &amp; iterate</text>
  <text x="215" y="365" font-size="12" fill="#1a8278">Claude writes the code</text>
  <line x1="355" y1="376" x2="355" y2="392" stroke="#7d8590" stroke-width="0.8" marker-end="url(#arrow)"/>

  <!-- step 6 -->
  <rect x="195" y="394" width="320" height="48" rx="8" fill="#fcefd6" stroke="#e0a33a" stroke-width="1"/>
  <circle cx="170" cy="418" r="15" fill="#e0a33a"/>
  <text x="170" y="423" font-size="14" font-weight="500" fill="#ffffff" text-anchor="middle">6</text>
  <text x="215" y="415" font-size="14" font-weight="500" fill="#7a4d0a">Set up git &amp; commit</text>
  <text x="215" y="431" font-size="12" fill="#a66b12">version your work</text>
  <line x1="355" y1="442" x2="355" y2="458" stroke="#7d8590" stroke-width="0.8" marker-end="url(#arrow)"/>

  <!-- step 7 -->
  <rect x="195" y="460" width="320" height="48" rx="8" fill="#fcefd6" stroke="#e0a33a" stroke-width="1"/>
  <circle cx="170" cy="484" r="15" fill="#e0a33a"/>
  <text x="170" y="489" font-size="14" font-weight="500" fill="#ffffff" text-anchor="middle">7</text>
  <text x="215" y="481" font-size="14" font-weight="500" fill="#7a4d0a">Push to GitHub</text>
  <text x="215" y="497" font-size="12" fill="#a66b12">create repo, push code</text>
  <line x1="355" y1="508" x2="355" y2="524" stroke="#7d8590" stroke-width="0.8" marker-end="url(#arrow)"/>

  <!-- step 8 -->
  <rect x="195" y="526" width="320" height="48" rx="8" fill="#fcefd6" stroke="#e0a33a" stroke-width="1"/>
  <circle cx="170" cy="550" r="15" fill="#e0a33a"/>
  <text x="170" y="555" font-size="14" font-weight="500" fill="#ffffff" text-anchor="middle">8</text>
  <text x="215" y="547" font-size="14" font-weight="500" fill="#7a4d0a">Deploy on Vercel</text>
  <text x="215" y="563" font-size="12" fill="#a66b12">import repo, get live url</text>
  <line x1="355" y1="574" x2="355" y2="590" stroke="#7d8590" stroke-width="0.8" marker-end="url(#arrow)"/>

  <!-- step 9 -->
  <rect x="195" y="592" width="320" height="48" rx="8" fill="#fcefd6" stroke="#e0a33a" stroke-width="1"/>
  <circle cx="170" cy="616" r="15" fill="#e0a33a"/>
  <text x="170" y="621" font-size="14" font-weight="500" fill="#ffffff" text-anchor="middle">9</text>
  <text x="215" y="613" font-size="14" font-weight="500" fill="#7a4d0a">Add Redis &amp; redeploy</text>
  <text x="215" y="629" font-size="12" fill="#a66b12">shared live results</text>
  <line x1="355" y1="640" x2="355" y2="656" stroke="#7d8590" stroke-width="0.8" marker-end="url(#arrow)"/>

  <!-- step 10 -->
  <rect x="195" y="658" width="320" height="48" rx="8" fill="#fcefd6" stroke="#e0a33a" stroke-width="1"/>
  <circle cx="170" cy="682" r="15" fill="#e0a33a"/>
  <text x="170" y="687" font-size="14" font-weight="500" fill="#ffffff" text-anchor="middle">10</text>
  <text x="215" y="679" font-size="14" font-weight="500" fill="#7a4d0a">Share the QR code</text>
  <text x="215" y="695" font-size="12" fill="#a66b12">everyone votes live</text>
</svg>
