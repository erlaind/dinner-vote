<svg width="680" viewBox="0 0 680 200" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Three phases: set up, build, ship">
  <title>Idea to live app in three phases</title>

  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#7d8590" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- phase 1: set up -->
  <rect x="30" y="55" width="190" height="110" rx="10" fill="#e6f1fb" stroke="#4a90d9" stroke-width="1"/>
  <text x="125" y="88" font-size="16" font-weight="500" fill="#0c447c" text-anchor="middle">1 · Set up</text>
  <text x="125" y="116" font-size="12" fill="#2d6ca8" text-anchor="middle">Install Claude Code,</text>
  <text x="125" y="134" font-size="12" fill="#2d6ca8" text-anchor="middle">make a folder, open it</text>

  <line x1="222" y1="110" x2="241" y2="110" stroke="#7d8590" stroke-width="1" marker-end="url(#arrow2)"/>

  <!-- phase 2: build -->
  <rect x="245" y="55" width="190" height="110" rx="10" fill="#def5f1" stroke="#2bb3a3" stroke-width="1"/>
  <text x="340" y="88" font-size="16" font-weight="500" fill="#0b5c54" text-anchor="middle">2 · Build</text>
  <text x="340" y="116" font-size="12" fill="#1a8278" text-anchor="middle">Prompt Claude,</text>
  <text x="340" y="134" font-size="12" fill="#1a8278" text-anchor="middle">preview, iterate</text>

  <line x1="437" y1="110" x2="456" y2="110" stroke="#7d8590" stroke-width="1" marker-end="url(#arrow2)"/>

  <!-- phase 3: ship -->
  <rect x="460" y="55" width="190" height="110" rx="10" fill="#fcefd6" stroke="#e0a33a" stroke-width="1"/>
  <text x="555" y="88" font-size="16" font-weight="500" fill="#7a4d0a" text-anchor="middle">3 · Ship</text>
  <text x="555" y="116" font-size="12" fill="#a66b12" text-anchor="middle">Git, GitHub, Vercel,</text>
  <text x="555" y="134" font-size="12" fill="#a66b12" text-anchor="middle">add storage, share QR</text>
</svg>
